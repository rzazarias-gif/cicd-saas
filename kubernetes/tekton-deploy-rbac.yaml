apiVersion: v1
kind: ServiceAccount
metadata:
  name: tekton-deployer
  namespace: cicd-platform
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tekton-deploy-role
  namespace: cicd-platform
rules:
  - apiGroups:
      - apps
    resources:
      - deployments
    verbs:
      - get
      - list
      - watch
      - patch
      - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tekton-deploy-rolebinding
  namespace: cicd-platform
subjects:
  - kind: ServiceAccount
    name: tekton-deployer
    namespace: cicd-platform
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tekton-deploy-role
