apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: build-image
  namespace: cicd-platform
spec:
  params:
    - name: image-url
      type: string
      description: Adresse de l'image dans le registre
      default: registry.kube-system.svc.cluster.local:80/demo-app:1.0

  workspaces:
    - name: source

  steps:
    - name: build-and-push
      image: quay.io/buildah/stable:v1.39.3
      securityContext:
        privileged: true
      script: |
        #!/bin/sh
        set -eu

        IMAGE="$(params.image-url)"
        APP_DIR="$(workspaces.source.path)/repo/demo-app"

        echo "=================================="
        echo "       BUILD DE L'APPLICATION"
        echo "=================================="

        cd "$APP_DIR"

        echo "Construction de l'image : $IMAGE"

        buildah bud \
          --storage-driver=vfs \
          --tls-verify=false \
          --format=docker \
          -t "$IMAGE" \
          .

        echo ""
        echo "=================================="
        echo "       PUBLICATION DE L'IMAGE"
        echo "=================================="

        buildah push \
          --storage-driver=vfs \
          --tls-verify=false \
          "$IMAGE" \
          "docker://$IMAGE"

        echo ""
        echo "Image construite et publiée."
