apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tekton-triggers-read-role
  namespace: cicd-platform
rules:
  - apiGroups:
      - triggers.tekton.dev
    resources:
      - triggers
      - triggerbindings
      - eventlisteners
      - triggertemplates
      - interceptors
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tekton-triggers-read-binding
  namespace: cicd-platform
subjects:
  - kind: ServiceAccount
    name: tekton-triggers-sa
    namespace: cicd-platform
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tekton-triggers-read-role
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: tekton-triggers-cluster-read
rules:
  - apiGroups:
      - triggers.tekton.dev
    resources:
      - clusterinterceptors
      - clustertriggerbindings
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tekton-triggers-cluster-read-binding
subjects:
  - kind: ServiceAccount
    name: tekton-triggers-sa
    namespace: cicd-platform
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tekton-triggers-cluster-read
