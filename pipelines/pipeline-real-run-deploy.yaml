apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: cicd-pipeline-deploy-
  namespace: cicd-platform

spec:
  pipelineRef:
    name: cicd-pipeline-real

  taskRunSpecs:
    - pipelineTaskName: deploy
      serviceAccountName: tekton-deployer

  workspaces:
    - name: source
      persistentVolumeClaim:
        claimName: cicd-source-pvc
